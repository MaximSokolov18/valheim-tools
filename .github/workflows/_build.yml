name: Build (reusable)

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the uploaded build artifact
        type: string
        default: site

permissions:
  contents: read

jobs:
  build:
    name: Static export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-app

      # Google IDs are public values (they appear in the page) kept in repository variables, not secrets.
      # Unset means no consent message, no Analytics and no ads in that build. See docs/compliance/google-ads-analytics.md.
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_ADSENSE_PUBLISHER_ID: ${{ vars.ADSENSE_PUBLISHER_ID }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_ADSENSE_SLOT_HOME: ${{ vars.ADSENSE_SLOT_HOME }}
          NEXT_PUBLIC_ADSENSE_SLOT_GUIDE: ${{ vars.ADSENSE_SLOT_GUIDE }}
          NEXT_PUBLIC_ADSENSE_SLOT_EDITOR: ${{ vars.ADSENSE_SLOT_EDITOR }}
          NEXT_PUBLIC_ADSENSE_SLOT_EDITOR_RAIL: ${{ vars.ADSENSE_SLOT_EDITOR_RAIL }}

      # Deploy ships exactly this output instead of building a second time.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: out/
          if-no-files-found: error
          retention-days: 7
