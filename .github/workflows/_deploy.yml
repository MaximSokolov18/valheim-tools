name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      firebase_project_id:
        description: Firebase project that hosts the site
        type: string
        required: true
      artifact_name:
        description: Build artifact to deploy (must match _build.yml)
        type: string
        default: site
    secrets:
      FIREBASE_SERVICE_ACCOUNT:
        description: Service account key JSON with the Firebase Hosting Admin role
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Never run two deploys at once, and never cancel one mid-release.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # firebase.json (headers, cleanUrls) lives in the repo.
      - uses: actions/checkout@v4

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: out/

      - name: Deploy to live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ inputs.firebase_project_id }}
          channelId: live
