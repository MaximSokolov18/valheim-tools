name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      gcp_project_id:
        description: GCP project that owns the bucket
        type: string
        required: true
      gcp_bucket:
        description: Destination GCS bucket name
        type: string
        required: true
      artifact_name:
        description: Build artifact to deploy (must match _build.yml)
        type: string
        default: site
    secrets:
      GCP_SA_KEY:
        description: Service account key JSON
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Sync to GCS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Never run two deploys at once, and never cancel one mid-sync.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check bucket is configured
        env:
          BUCKET: ${{ inputs.gcp_bucket }}
        run: |
          if [ -z "$BUCKET" ]; then
            echo "::error::GCP_BUCKET repository variable is empty. Set it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: out/

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ inputs.gcp_project_id }}

      - name: Sync hashed static assets (long-lived cache)
        run: >
          gsutil -m -h "Cache-Control:public,max-age=31536000,immutable"
          rsync -r -d out/_next/static gs://${{ inputs.gcp_bucket }}/_next/static

      - name: Sync remaining output (no-cache)
        run: >
          gsutil -m -h "Cache-Control:no-cache"
          rsync -r -d -x '^_next/static/.*' out/ gs://${{ inputs.gcp_bucket }}
