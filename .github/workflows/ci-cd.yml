name: CI/CD

# Entry point: decides WHEN stages run and in what order.
# The stages themselves live in _test.yml, _build.yml and _deploy.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# A newer push to a PR supersedes the older run. Runs on main are never cancelled.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    uses: ./.github/workflows/_test.yml

  build:
    name: Build
    uses: ./.github/workflows/_build.yml

  deploy:
    name: Deploy
    needs: [test, build]
    # Only main (push or manual run); PRs stop after test + build.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_deploy.yml
    with:
      gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
      gcp_bucket: ${{ vars.GCP_BUCKET }}
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
